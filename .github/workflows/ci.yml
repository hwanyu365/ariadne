name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # .gitignore 가 놓친 비밀 파일이 추적되면 merge 전에 막는다. 값 없는 예시 파일(*.example)은 허용한다.
      - name: Guard secrets
        run: |
          leaked=$(git ls-files | grep -E '(^|/)\.env(\..*)?$|\.(pem|key|p12)$' | grep -vE '\.example$' || true)
          if [ -n "$leaked" ]; then echo "::error::committed secret files: $leaked"; exit 1; fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      # 비밀값 없이 실행한다 → fork PR 에서도 같은 결과여야 한다.
      - run: |
          python test_scrape.py
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # Ubuntu 24.04 는 비특권 user namespace 를 막아 Chromium 샌드박스가 뜨지 않는다.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: xvfb-run -a npm test
